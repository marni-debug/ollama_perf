[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fitness"
version = "0.1.0"
description = "Personal coding-agent fitness test for local Ollama models"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
check-llm = "llm_fitness.cli:main"

[tool.setuptools.packages.find]
include = ["llm_fitness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
